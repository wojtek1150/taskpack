<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="Geist, 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>Ścieżka zakupu</title><defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#E7E5E0" stroke-width="1"/></pattern><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#3D3935"/></marker></defs><rect width="1200" height="900" fill="#FAFAF8"/><rect width="1200" height="900" fill="url(#grid)"/><text x="60" y="86" font-size="34" font-weight="900" fill="#1C1917" font-family="Archivo, 'Arial Black', 'Helvetica Neue', Arial, sans-serif">Ścieżka zakupu</text><text x="60" y="120" font-size="18" fill="#67615B">StoreKit 2, weryfikacja na urządzeniu — bez serwera</text><g><rect x="60" y="200" width="240" height="84" rx="14" fill="#FFFFFF" stroke="#3D3935" stroke-width="2.5"/><text x="180" y="238" font-size="22" font-weight="700" fill="#1C1917" text-anchor="middle">Pobierz produkty</text><text x="180" y="264" font-size="15" fill="#1C1917" text-anchor="middle" font-family="'Geist Mono', Menlo, Consolas, monospace" opacity="0.75">Product.products</text></g><g><rect x="420" y="200" width="240" height="84" rx="14" fill="#C2410C" stroke="none" stroke-width="2.5"/><text x="540" y="238" font-size="22" font-weight="700" fill="#FFF7E6" text-anchor="middle">Paywall</text><text x="540" y="264" font-size="15" fill="#FFF7E6" text-anchor="middle" font-family="'Geist Mono', Menlo, Consolas, monospace" opacity="0.75">po wypieku #3</text></g><g><rect x="780" y="200" width="330" height="84" rx="14" fill="#FFFFFF" stroke="#3D3935" stroke-width="2.5"/><text x="945" y="238" font-size="22" font-weight="700" fill="#1C1917" text-anchor="middle">Zakup</text><text x="945" y="264" font-size="15" fill="#1C1917" text-anchor="middle" font-family="'Geist Mono', Menlo, Consolas, monospace" opacity="0.75">product.purchase()</text></g><g><rect x="780" y="420" width="330" height="84" rx="14" fill="#FBF1D3" stroke="#D99A06" stroke-width="2.5" stroke-dasharray="8 6"/><text x="945" y="458" font-size="22" font-weight="700" fill="#1C1917" text-anchor="middle">Oczekuje</text><text x="945" y="484" font-size="15" fill="#1C1917" text-anchor="middle" font-family="'Geist Mono', Menlo, Consolas, monospace" opacity="0.75">Ask to Buy</text></g><g><rect x="780" y="640" width="330" height="84" rx="14" fill="#7C2D12" stroke="none" stroke-width="2.5"/><text x="945" y="678" font-size="22" font-weight="700" fill="#FFF7E6" text-anchor="middle">Pro odblokowane</text><text x="945" y="704" font-size="15" fill="#FFF7E6" text-anchor="middle" font-family="'Geist Mono', Menlo, Consolas, monospace" opacity="0.75">Transaction.verified</text></g><g><rect x="60" y="640" width="240" height="84" rx="14" fill="#FFFFFF" stroke="#3D3935" stroke-width="2.5"/><text x="180" y="678" font-size="22" font-weight="700" fill="#1C1917" text-anchor="middle">Przywróć</text><text x="180" y="704" font-size="15" fill="#1C1917" text-anchor="middle" font-family="'Geist Mono', Menlo, Consolas, monospace" opacity="0.75">AppStore.sync()</text></g><g><rect x="420" y="420" width="240" height="84" rx="14" fill="#FFFFFF" stroke="#3D3935" stroke-width="2.5"/><text x="540" y="458" font-size="22" font-weight="700" fill="#1C1917" text-anchor="middle">Anulowano</text><text x="540" y="484" font-size="15" fill="#1C1917" text-anchor="middle" font-family="'Geist Mono', Menlo, Consolas, monospace" opacity="0.75">userCancelled</text></g><path d="M300 242H412" fill="none" stroke="#3D3935" stroke-width="3" marker-end="url(#ah)"/><path d="M660 242H772" fill="none" stroke="#3D3935" stroke-width="3" marker-end="url(#ah)"/><path d="M945 284V412" fill="none" stroke="#3D3935" stroke-width="3" marker-end="url(#ah)"/><text x="1010" y="354" font-size="15" fill="#67615B" text-anchor="middle">Ask to Buy</text><path d="M945 504V632" fill="non